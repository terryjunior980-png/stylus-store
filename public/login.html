<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STYLUS — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: 'Helvetica Neue', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .nav { padding: 1.5rem 2.5rem; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Space Mono', monospace; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.25em; color: #fff; text-decoration: none; }
    .nav-back { font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; color: #888; text-decoration: none; }
    .nav-back:hover { color: #fff; }
    .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.05) 0%, transparent 70%); }
    .box { background: #0a0a0a; border: 1px solid #222; padding: 3rem; width: 100%; max-width: 420px; }
    .title { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; text-align: center; margin-bottom: 0.5rem; }
    .sub { font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.2em; color: #555; text-transform: uppercase; text-align: center; margin-bottom: 2.5rem; }
    .tabs { display: flex; margin-bottom: 2rem; border-bottom: 1px solid #222; }
    .tab { flex: 1; padding: 0.75rem; font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; cursor: pointer; color: #555; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.2s, border-color 0.2s; }
    .tab.active { color: #c9a84c; border-bottom-color: #c9a84c; }
    .panel { display: none; }
    .panel.active { display: block; }
    .group { margin-bottom: 1rem; }
    .group label { display: block; font-family: 'Space Mono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; color: #555; text-transform: uppercase; margin-bottom: 0.4rem; }
    .group input { width: 100%; background: #111; border: 1px solid #222; color: #fff; padding: 0.8rem 1rem; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
    .group input:focus { border-color: #c9a84c; }
    .group input::placeholder { color: #444; }
    .btn { width: 100%; padding: 0.9rem; background: #fff; color: #000; border: none; font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #c9a84c; }
    .error { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); color: #ff4444; padding: 0.75rem 1rem; font-family: 'Space Mono', monospace; font-size: 0.65rem; margin-bottom: 1rem; display: none; }
    .success { background: rgba(37,211,102,0.1); border: 1px solid rgba(37,211,102,0.3); color: #25d366; padding: 0.75rem 1rem; font-family: 'Space Mono', monospace; font-size: 0.65rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">STYLUS</a>
    <a href="/" class="nav-back">← Back to Store</a>
  </nav>
  <div class="container">
    <div class="box">
      <h1 class="title">Welcome</h1>
      <p class="sub">Sign in to your account</p>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('signin')">Sign In</button>
        <button class="tab" onclick="switchTab('signup')">Create Account</button>
      </div>
      <div class="error" id="errorMsg"></div>
      <div class="success" id="successMsg"></div>

      <!-- SIGN IN -->
      <div class="panel active" id="signinPanel">
        <div class="group"><label>Email</label><input type="email" id="siEmail" placeholder="your@email.com" /></div>
        <div class="group"><label>Password</label><input type="password" id="siPassword" placeholder="••••••••" /></div>
        <button class="btn" onclick="signIn()">Sign In</button>
      </div>

      <!-- SIGN UP -->
      <div class="panel" id="signupPanel">
        <div class="group"><label>Full Name</label><input type="text" id="suName" placeholder="Your full name" /></div>
        <div class="group"><label>Email</label><input type="email" id="suEmail" placeholder="your@email.com" /></div>
        <div class="group"><label>Password</label><input type="password" id="suPassword" placeholder="Min. 6 characters" /></div>
        <button class="btn" onclick="signUp()">Create Account</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var client = window.supabase.createClient(
      'https://fwvqrtutkchlpjhujqbf.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3dnFydHV0a2NobHBqaHVqcWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDA2NzUsImV4cCI6MjA5NTQ3NjY3NX0.2-l6oGPzpRhImO6715SET_C_d394e2oYcmBdx5o8_00'
    );

    // If already logged in go to store
    client.auth.getSession().then(function(r) {
      if (r.data.session) window.location.href = '/';
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
      if (tab === 'signin') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('signinPanel').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('signupPanel').classList.add('active');
      }
      hideMessages();
    }

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
      var el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function hideMessages() {
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
    }

    async function signIn() {
      var email = document.getElementById('siEmail').value.trim();
      var password = document.getElementById('siPassword').value;
      if (!email || !password) { showError('Please fill in all fields'); return; }
      var result = await client.auth.signInWithPassword({ email: email, password: password });
      if (result.error) { showError(result.error.message); }
      else { window.location.href = '/'; }
    }

    async function signUp() {
      var name = document.getElementById('suName').value.trim();
      var email = document.getElementById('suEmail').value.trim();
      var password = document.getElementById('suPassword').value;
      if (!name || !email || !password) { showError('Please fill in all fields'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters'); return; }
      var result = await client.auth.signUp({
        email: email,
        password: password,
        options: { data: { full_name: name } }
      });
      if (result.error) { showError(result.error.message); }
      else { showSuccess('Account created! Check your email to verify, then sign in.'); }
    }
  </script>
</body>
</html>
